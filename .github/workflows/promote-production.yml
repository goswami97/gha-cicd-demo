name: Promote to Production
run-name: "Promote to Production (${{ github.ref_type == 'tag' && github.ref_name || 'manual dispatch' }})"

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote (commit SHA). Defaults to the tag currently deployed in qa.'
        required: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: goswami97/gha-cicd-demo-manifests
          token: ${{ secrets.DEPLOY_PAT }}
      - name: Resolve image to promote
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE="ghcr.io/goswami97/gha-cicd-demo:${{ github.event.inputs.image_tag }}"
          else
            IMAGE=$(grep -oP '(?<=image: ).*' qa/deployment.yaml)
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Verify image actually exists in GHCR
        run: |
          if ! docker manifest inspect "${{ steps.resolve.outputs.image }}" > /dev/null 2>&1; then
            echo "::error::${{ steps.resolve.outputs.image }} does not exist in GHCR. Refusing to promote a non-existent image."
            exit 1
          fi
      - name: Bump production manifest and push
        run: |
          sed -i "s|image: ghcr.io/.*|image: ${{ steps.resolve.outputs.image }}|" production/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add production/deployment.yaml
          if git diff --staged --quiet; then
            echo "No manifest change, skipping."
            exit 0
          fi
          git commit -m "chore: promote ${{ steps.resolve.outputs.image }} to production"
          git push origin main
      - name: Next step
        run: |
          echo "Manifest updated. gha-cicd-demo-production is a manual-sync ArgoCD Application."
          echo "Sync it via the ArgoCD UI, or: kubectl patch application gha-cicd-demo-production -n argocd --type merge -p '{\"operation\":{\"sync\":{}}}'"
