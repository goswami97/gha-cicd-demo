name: Promote to Production
run-name: "Promote to Production (${{ github.ref_type == 'tag' && github.ref_name || 'manual dispatch' }})"

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote (commit SHA). Defaults to the tag currently deployed in qa.'
        required: false

permissions:
  contents: read

jobs:
  # Resolves and validates the image before the production approval gate, so a bad tag
  # fails immediately instead of after someone has approved it.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: goswami97/gha-cicd-demo-manifests
          token: ${{ secrets.DEPLOY_PAT }}
      - name: Resolve image to promote
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          QA_IMAGE=$(grep -oP '(?<=image: ).*' qa/deployment.yaml)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A release tag must ship the commit it points at, and only once QA is running that commit.
            TAG_SHA=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref }}" --jq .sha)
            IMAGE="ghcr.io/goswami97/gha-cicd-demo:$TAG_SHA"
            if [ "$IMAGE" != "$QA_IMAGE" ]; then
              echo "::error::${{ github.ref_name }} points at $TAG_SHA, but qa is running $QA_IMAGE. Promote $TAG_SHA to qa first, then re-run this workflow."
              exit 1
            fi
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE="ghcr.io/goswami97/gha-cicd-demo:${{ github.event.inputs.image_tag }}"
          else
            IMAGE="$QA_IMAGE"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Verify image actually exists in GHCR
        run: |
          if ! docker manifest inspect "${{ steps.resolve.outputs.image }}" > /dev/null 2>&1; then
            echo "::error::${{ steps.resolve.outputs.image }} does not exist in GHCR. Refusing to promote a non-existent image."
            exit 1
          fi

  promote:
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: goswami97/gha-cicd-demo-manifests
          token: ${{ secrets.DEPLOY_PAT }}
      - name: Bump production manifest and push
        run: |
          sed -i "s|image: ghcr.io/.*|image: ${{ needs.resolve.outputs.image }}|" production/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add production/deployment.yaml
          if git diff --staged --quiet; then
            echo "No manifest change, skipping."
            exit 0
          fi
          git commit -m "chore: promote ${{ needs.resolve.outputs.image }} to production"
          # update-manifest and promote-qa push to the same repo; each touches a different file, so a rebase never conflicts.
          for attempt in 1 2 3 4 5; do
            git push origin main && exit 0
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git pull --rebase origin main
          done
          echo "::error::Could not push manifest update after 5 attempts."
          exit 1
      - name: Next step
        run: |
          echo "Manifest updated. gha-cicd-demo-production is a manual-sync ArgoCD Application."
          echo "Sync it via the ArgoCD UI, or: kubectl patch application gha-cicd-demo-production -n argocd --type merge -p '{\"operation\":{\"sync\":{}}}'"
