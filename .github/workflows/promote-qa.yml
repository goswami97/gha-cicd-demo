name: Promote to QA

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to promote (commit SHA). Defaults to the tag currently deployed in development.'
        required: false

permissions:
  contents: read

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: qa
    env:
      GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: goswami97/gha-cicd-demo-manifests
          token: ${{ secrets.DEPLOY_PAT }}
      - name: Resolve image to promote
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE="ghcr.io/goswami97/gha-cicd-demo:${{ github.event.inputs.image_tag }}"
          else
            IMAGE=$(grep -oP '(?<=image: ).*' development/deployment.yaml)
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Verify image actually exists in GHCR
        run: |
          if ! docker manifest inspect "${{ steps.resolve.outputs.image }}" > /dev/null 2>&1; then
            echo "::error::${{ steps.resolve.outputs.image }} does not exist in GHCR. Refusing to promote a non-existent image."
            exit 1
          fi
      - name: Bump qa manifest and push
        run: |
          sed -i "s|image: ghcr.io/.*|image: ${{ steps.resolve.outputs.image }}|" qa/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qa/deployment.yaml
          if git diff --staged --quiet; then
            echo "No manifest change, skipping."
            exit 0
          fi
          git commit -m "chore: promote ${{ steps.resolve.outputs.image }} to qa"
          git push origin main
